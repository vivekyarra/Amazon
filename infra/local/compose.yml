services:
  done-irl:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ledger:/data
    environment:
      GUIDED_MODE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  ledger:
