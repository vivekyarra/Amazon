name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Domain, security and MCP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libgles2 libegl1
      - run: uv sync --frozen --extra ring-video --extra aws
      - run: uv run --extra ring-video --extra aws ruff check apps/mcp-orchestrator apps/vision-webrtc-engine scripts
      - run: uvx --from cfn-lint==1.57.2 cfn-lint infra/aws/template.yaml
      # Official MediaPipe pose model, SHA-256 pinned (same source as scripts/check-public-pose.py).
      - run: uv run --extra ring-video --extra aws python scripts/fetch-pose-model.py
      - run: uv run --extra ring-video --extra aws pytest -q --junitxml=artifacts/backend-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: artifacts/backend-results.xml
  browser:
    name: Build and browser journeys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: uv sync --frozen
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/playwright/
            artifacts/screenshots/
  native-build:
    name: Fire OS APK build (device validation separate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p apps/firetv-command-hud assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: fire-os-debug-apk
          path: apps/firetv-command-hud/app/build/outputs/apk/debug/*.apk
  firetv-emulator:
    name: Fire OS APK on Android TV emulator (D-pad journey)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p apps/firetv-command-hud assembleDebug --no-daemon --max-workers=2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
      - run: sudo apt-get update && sudo apt-get install -y libgl1
      - run: uv sync --frozen
      - run: npm ci --no-audit --no-fund && npm run build
      - name: Start demo backend
        run: |
          nohup uv run --frozen uvicorn --app-dir apps/mcp-orchestrator done_irl.api:app --host 127.0.0.1 --port 8080 > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health/ready && break; sleep 2; done
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: uv run --frozen python scripts/firetv-emulator-check.py --serial emulator-5554 --out artifacts/firetv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firetv-emulator-evidence
          path: |
            artifacts/firetv/
            backend.log
  container:
    name: Container build and durable replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
      - run: uv sync --frozen
      - run: docker build -f infra/local/Dockerfile -t done-irl:validation .
      - run: uv run python scripts/smoke-container.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: artifacts/container/
