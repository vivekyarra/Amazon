[project]
name = "done-irl"
version = "0.1.0"
description = "Evidence-backed commitments across a shared household reality ledger"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "mcp>=1.20,<2",
    "numpy>=2,<3",
    "opencv-contrib-python>=4.11,<5",
]

[project.optional-dependencies]
human-pose = [
    "mediapipe>=0.10.32,<0.11",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/mcp-orchestrator"]
testpaths = ["apps/mcp-orchestrator/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
