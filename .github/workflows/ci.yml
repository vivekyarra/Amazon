name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Domain, security and MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.0'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check apps/mcp-orchestrator
      - run: uv run pytest -q --junitxml=artifacts/backend-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: artifacts/backend-results.xml
  browser:
    name: Build and browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.0'
      - run: uv sync --frozen
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/playwright/
            artifacts/screenshots/
  native-build:
    name: Fire OS APK build (device validation separate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p apps/firetv-command-hud assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: fire-os-debug-apk
          path: apps/firetv-command-hud/app/build/outputs/apk/debug/*.apk
